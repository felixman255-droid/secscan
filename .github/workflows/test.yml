name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # A suite e Python puro (nao baixa binario externo), entao rodar nos dois
    # sistemas custa segundos. Sem isso, um teste que so passa onde foi escrito
    # chega verde no push e quebra no runner — foi o que aconteceu no 2509e0a.
    # fail-fast: false para ver o resultado dos dois lados, nao so do primeiro
    # que falhou.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 3.11 e o minimo anunciado no README
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Testes do nucleo
        run: python -m unittest discover -s tests -v
