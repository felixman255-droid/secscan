<title id="t">Como o secscan funciona</title>
<desc id="d">O projeto passa por gitleaks, osv-scanner, semgrep e trivy. Os resultados são consolidados por severidade, o baseline separa os aceitos, e saem relatorio.md, secscan.sarif e os JSONs brutos.</desc>
