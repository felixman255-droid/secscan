<title id="t">Antes e depois do secscan</title>
<desc id="d">Antes: um projeto fictício com segredo no código, shell=True, MD5, pyyaml vulnerável e contêiner como root. Depois: o secscan roda as quatro camadas e lista 5 achados críticos, 11 altos, 14 médios e 1 baixo.</desc>
